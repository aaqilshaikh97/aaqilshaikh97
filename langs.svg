<svg width="480" height="300" viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ff4fd8"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#181030"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <clipPath id="frame"><rect width="480" height="300" rx="20"/></clipPath>
  <clipPath id="barClip"><rect x="24" y="60" width="432" height="14" rx="7"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="480" height="300" fill="url(#bgGrad)"/>
  <text x="24" y="32" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff">Most Used Languages</text>

